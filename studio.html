<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0b14">
<title>Ngage Studio · Messages</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0b14;--panel:#17141f;--panel2:#211d2c;--line:#2c2738;--text:#f4f1fa;--muted:#9a93ab;--accent:#ff1a5e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .wrap{max-width:760px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px 40px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  header img{height:44px}
  header h1{font-family:'Archivo Black',sans-serif;font-size:20px;flex:1;line-height:1.1}
  @media (max-width:480px){header img{height:36px}header h1{font-size:17px}}
  .pill{font-size:12px;font-weight:700;padding:7px 12px;border-radius:99px;background:var(--panel2);color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
  .pill .d{width:8px;height:8px;border-radius:50%;background:#3ddc84}
  .pill.off .d{background:#ff6b8a}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .tbtn{font-size:13px;font-weight:600;padding:9px 14px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
  .tbtn.on{background:var(--text);color:var(--bg);border-color:var(--text)}
  .count{margin-left:auto;font-size:13px;color:var(--muted);align-self:center}
  .msg{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px;position:relative}
  .msg.new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 30px rgba(255,26,94,.25);animation:pop .4s ease}
  @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
  .top{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .name{font-weight:700;font-size:17px}
  .time{font-size:12px;color:var(--muted)}
  .show{font-size:11px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:99px;background:linear-gradient(135deg,#ff0040,#ff00cc);color:#fff}
  .text{font-size:19px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
  .contact{font-size:13px;color:var(--muted);margin-top:10px}
  .actions{margin-left:auto}
  .actions button{font-size:12px;font-weight:700;padding:7px 11px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.6}
  .login{max-width:360px;margin:12vh auto 0;text-align:center}
  .login img{height:64px;margin-bottom:18px}
  .login h2{font-family:'Archivo Black',sans-serif;font-size:24px;margin-bottom:6px}
  .login p{color:var(--muted);font-size:14px;margin-bottom:20px}
  .login input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--text);font:inherit;font-size:16px;outline:none;text-align:center}
  .login input:focus{border-color:var(--accent)}
  .login button{width:100%;margin-top:12px;padding:14px;border-radius:99px;background:linear-gradient(135deg,#ff0040,#ff00cc);color:#fff;font-weight:800;font-size:15px}
  .login .err{color:#ff6b8a;font-size:13px;margin-top:12px;min-height:18px}
  .hidden{display:none!important}
  .tbtn .n{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;text-align:center}
  .tbtn.on .n{background:var(--bg);color:var(--text)}
  .search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:inherit;font-size:16px;outline:none;margin-bottom:14px}
  .search:focus{border-color:var(--accent)}
  .day{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}
  .day:first-child{margin-top:4px}
  .more{display:block;width:100%;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:14px;margin-top:6px}
  .arch .text{font-size:16px}
  .arch .msg{opacity:.85}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  @media (min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
  .tile b{display:block;font-family:'Archivo Black',sans-serif;font-size:28px;line-height:1.1}
  .tile span{font-size:12px;color:var(--muted)}
  .tile i{font-style:normal;font-size:11px;color:var(--muted);display:block;margin-top:4px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .panel h3{font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
  .panel h3 small{font-size:11px;color:var(--muted);font-weight:500}
  .bars{display:flex;align-items:flex-end;gap:3px;height:120px}
  .bars div{flex:1;background:linear-gradient(180deg,#ff00cc,#ff0040);border-radius:3px 3px 0 0;min-height:2px;position:relative}
  .bars div.zero{background:var(--line)}
  .bars div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:11px;font-weight:700;padding:3px 6px;border-radius:6px;white-space:nowrap;margin-bottom:4px;z-index:2}
  .axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:6px}
  .toplist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;list-style:none}
  .toplist li:last-child{border-bottom:0}
  .toplist li span:last-child{color:var(--muted);white-space:nowrap}
  .note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="login" id="login">
    <img src="logo.png" alt="Ngage Radio">
    <h2>Studio messages</h2>
    <p>For presenters only. Enter the studio password.</p>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="Studio password" autocomplete="current-password" required>
      <button type="submit" id="loginBtn">Open studio</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>

  <div class="hidden" id="app">
    <header>
      <img src="logo.png" alt="Ngage Radio">
      <h1>Studio messages</h1>
      <span class="pill" id="status"><span class="d"></span><span id="statusText">Live</span></span>
    </header>
    <div class="bar">
      <button class="tbtn on" data-f="open">To read<span class="n" id="nOpen">0</span></button>
      <button class="tbtn" data-f="archive">Archive</button>
      <button class="tbtn" data-f="stats">📊 Stats</button>
      <button class="tbtn" id="soundBtn">🔔 Sound on</button>
      <button class="tbtn" id="logout">Lock</button>
      <span class="count" id="count"></span>
    </div>
    <input class="search hidden" id="q" type="search" placeholder="Search names, messages, shows…" autocomplete="off">
    <div id="list"></div>
    <div id="stats" class="hidden"><div class="empty">Loading stats…</div></div>
    <button class="more hidden" id="older">Load older messages</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
let key="";try{key=sessionStorage.getItem("studioKey")||""}catch(_){}
const byKey=new Map();          // all messages we know about, keyed by storage key
let seen=new Set(store.get("studioSeen",[])),filter="open",sound=store.get("studioSound",true),first=true,timer=null,audioCtx=null,hasOlder=false,oldestKey="",pending=new Map();

const api=(opts={})=>fetch("/api/studio-messages"+(opts.qs||""),{method:opts.method||"GET",headers:{"x-studio-key":key,"content-type":"application/json"},body:opts.body,cache:"no-store"});
function ago(iso){const s=Math.max(0,(Date.now()-new Date(iso))/1000);if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" hr ago";return new Date(iso).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
function clock(iso){return new Date(iso).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
function dayLabel(iso){const d=new Date(iso),t=new Date();const k=x=>x.toDateString();const y=new Date(t);y.setDate(t.getDate()-1);
  if(k(d)===k(t))return"Today";if(k(d)===k(y))return"Yesterday";return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:d.getFullYear()===t.getFullYear()?undefined:"numeric"})}
function ping(){
  if(!sound)return;
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;
    [880,1320].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0.0001,t+i*.15);g.gain.exponentialRampToValueAtTime(0.25,t+i*.15+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+i*.15+.3);o.start(t+i*.15);o.stop(t+i*.15+.32)})}catch(_){}
}
const sorted=()=>[...byKey.values()].sort((a,b)=>a.key<b.key?1:-1);
function card(m,archive){
  const isNew=!archive&&!seen.has(m.key)&&!first;
  return `<div class="msg${isNew?" new":""}">
      <div class="top"><span class="name">${esc(m.name||"Anonymous")}</span><span class="time">${archive?clock(m.created):ago(m.created)}</span>${m.show?`<span class="show">LIVE · ${esc(m.show)}</span>`:""}<span class="actions"><button data-k="${esc(m.key)}" data-to="${archive?"0":"1"}">${archive?"↩ To read":"✓ Done"}</button></span></div>
      <div class="text">${esc(m.message)}</div>
      ${m.contact?`<div class="contact">Reply to: ${esc(m.contact)}</div>`:""}
    </div>`;
}
function render(){
  const st=filter==="stats";
  $("stats").classList.toggle("hidden",!st);$("list").classList.toggle("hidden",st);
  if(st){$("q").classList.add("hidden");$("older").classList.add("hidden");$("count").textContent="";return}
  const all=sorted();
  const open=all.filter(m=>!m.done);
  $("nOpen").textContent=open.length;
  document.title=(open.length?`(${open.length}) `:"")+"Ngage Studio · Messages";
  $("count").textContent=filter==="open"?`${open.length} to read`:`${all.filter(m=>m.done).length} archived`;
  const arch=filter==="archive";
  $("q").classList.toggle("hidden",!arch);
  $("older").classList.toggle("hidden",!(arch&&hasOlder));
  $("list").classList.toggle("arch",arch);
  if(!arch){
    $("list").innerHTML=open.length?open.map(m=>card(m,false)).join(""):`<div class="empty">${all.length?"All caught up 🎉<br>Read messages are in the Archive.":"No messages yet.<br>New ones will pop up here automatically."}</div>`;
    return;
  }
  const q=$("q").value.trim().toLowerCase();
  const items=all.filter(m=>m.done&&(!q||[m.name,m.message,m.show,m.contact].join(" ").toLowerCase().includes(q)));
  if(!items.length){$("list").innerHTML=`<div class="empty">${q?"No archived messages match that.":"Nothing in the archive yet.<br>Messages you mark ✓ Done land here."}</div>`;return}
  let html="",last="";
  for(const m of items){const d=dayLabel(m.created);if(d!==last){html+=`<div class="day">${esc(d)}</div>`;last=d}html+=card(m,true)}
  $("list").innerHTML=html;
}
function absorb(list){for(const m of list){const p=pending.get(m.key);if(p!==undefined)m.done=p;byKey.set(m.key,m)}}
async function load(){
  try{
    const r=await api({qs:"?limit=200"});
    if(r.status===401){lock("That password didn't work.");return}
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||r.status);
    const fresh=j.messages.filter(m=>!m.done&&!seen.has(m.key));
    absorb(j.messages);
    if(first){hasOlder=j.more;oldestKey=j.messages.length?j.messages[j.messages.length-1].key:""}
    if(!first&&fresh.length)ping();
    render();
    if(first){j.messages.forEach(m=>seen.add(m.key))}
    else setTimeout(()=>{fresh.forEach(m=>seen.add(m.key));store.set("studioSeen",[...seen].slice(-1000))},4000);
    first=false;
    $("status").classList.remove("off");$("statusText").textContent="Live";
  }catch(e){
    $("status").classList.add("off");$("statusText").textContent=String(e.message||"").includes("not set up")?"Password not set up on Netlify":"Reconnecting…";
  }
}
async function loadOlder(){
  if(!oldestKey)return;
  $("older").textContent="Loading…";
  try{
    const r=await api({qs:"?limit=200&before="+encodeURIComponent(oldestKey)});
    const j=await r.json();if(!r.ok)throw new Error();
    absorb(j.messages);j.messages.forEach(m=>seen.add(m.key));
    hasOlder=j.more;if(j.messages.length)oldestKey=j.messages[j.messages.length-1].key;
    render();
  }catch(_){}
  $("older").textContent="Load older messages";
}
async function setDone(k,done){
  const m=byKey.get(k);if(!m)return;
  const prev=m.done;m.done=done;pending.set(k,done);render();
  try{const r=await api({method:"POST",body:JSON.stringify({key:k,done})});if(!r.ok)throw new Error()}
  catch(_){m.done=prev;alertBar("Couldn't save that — check your connection.")}
  finally{pending.delete(k);render()}
}
let statsTimer=null;
const fmtDay=(d,o)=>new Date(d+"T12:00:00").toLocaleDateString("en-GB",o);
async function loadStats(){
  try{
    const r=await fetch("/api/studio-stats",{headers:{"x-studio-key":key},cache:"no-store"});
    if(r.status===401){lock("That password didn't work.");return}
    const s=await r.json();if(!r.ok)throw new Error(s.error||r.status);
    const max=Math.max(1,...s.days.map(d=>d.visitors)),hmax=Math.max(1,...s.hours);
    const hourLabel=h=>h===0?"midnight":h===12?"noon":h<12?h+"am":(h-12)+"pm";
    const busiest=s.hours.indexOf(Math.max(...s.hours));
    $("stats").innerHTML=`
      <div class="tiles">
        <div class="tile"><b>${s.today.visitors}</b><span>Visitors today</span><i>${s.today.plays} plays</i></div>
        <div class="tile"><b>${s.week.visits}</b><span>Visits · last 7 days</span><i>${s.week.plays} plays</i></div>
        <div class="tile"><b>${s.month.visits}</b><span>Visits · last 30 days</span><i>${s.month.plays} plays</i></div>
        <div class="tile"><b>${s.today.home}</b><span>From home screen today</span><i>people who saved the app</i></div>
      </div>
      <div class="panel"><h3>Visitors per day <small>last 30 days</small></h3>
        <div class="bars">${s.days.map(d=>`<div class="${d.visitors?"":"zero"}" style="height:${Math.max(2,d.visitors/max*100)}%" data-t="${fmtDay(d.date,{day:"numeric",month:"short"})}: ${d.visitors}"></div>`).join("")}</div>
        <div class="axis"><span>${fmtDay(s.days[0].date,{day:"numeric",month:"short"})}</span><span>Today</span></div>
      </div>
      <div class="panel"><h3>Busiest times <small>${s.hours.some(Boolean)?"peak around "+hourLabel(busiest):"no visits yet"}</small></h3>
        <div class="bars" style="height:80px">${s.hours.map((v,h)=>`<div class="${v?"":"zero"}" style="height:${Math.max(2,v/hmax*100)}%" data-t="${hourLabel(h)}: ${v}"></div>`).join("")}</div>
        <div class="axis"><span>midnight</span><span>6am</span><span>noon</span><span>6pm</span><span>11pm</span></div>
      </div>
      <div class="panel"><h3>Top shows played in the app <small>last 30 days</small></h3>
        ${s.topShows.length?`<ul class="toplist">${s.topShows.map(t=>`<li><span>${esc(t.title)}</span><span>${t.plays} play${t.plays>1?"s":""}</span></li>`).join("")}</ul>`:`<p class="note">No plays yet.</p>`}
      </div>
      ${s.liveDays.length?`<div class="panel"><h3>On the app during live shows</h3><ul class="toplist">${s.liveDays.slice().reverse().map(d=>`<li><span>${fmtDay(d.date,{weekday:"short",day:"numeric",month:"short"})}</span><span>${d.listeners} people</span></li>`).join("")}</ul></div>`:""}
      <p class="note">Counted without cookies. Each visitor is a scrambled code that resets daily, so someone who visits on three different days counts as three visits. Plays here are plays started from the app; Mixcloud's own stats include plays elsewhere.</p>`;
  }catch(e){$("stats").innerHTML=`<div class="empty">Couldn't load stats right now.</div>`}
}

function alertBar(t){$("statusText").textContent=t;$("status").classList.add("off");setTimeout(()=>{$("status").classList.remove("off");$("statusText").textContent="Live"},4000)}
function start(){
  $("login").classList.add("hidden");$("app").classList.remove("hidden");
  first=true;byKey.clear();load();clearInterval(timer);timer=setInterval(load,5000);
}
function lock(msg){
  clearInterval(timer);key="";try{sessionStorage.removeItem("studioKey")}catch(_){}
  $("app").classList.add("hidden");$("login").classList.remove("hidden");$("loginErr").textContent=msg||"";
}
$("loginForm").onsubmit=async e=>{
  e.preventDefault();$("loginBtn").textContent="Checking…";$("loginErr").textContent="";
  key=$("pw").value;
  try{
    const r=await api({qs:"?limit=1"});
    if(r.status===401){$("loginErr").textContent="That password didn't work.";return}
    if(!r.ok){const j=await r.json().catch(()=>({}));$("loginErr").textContent=j.error||"Couldn't connect. Try again.";return}
    try{sessionStorage.setItem("studioKey",key)}catch(_){}
    $("pw").value="";start();
  }catch(_){$("loginErr").textContent="Couldn't connect. Try again."}
  finally{$("loginBtn").textContent="Open studio"}
};
document.addEventListener("click",e=>{
  const d=e.target.closest("[data-k]");if(d){setDone(d.dataset.k,d.dataset.to==="1");return}
  const f=e.target.closest("[data-f]");if(f){filter=f.dataset.f;document.querySelectorAll("[data-f]").forEach(b=>b.classList.toggle("on",b===f));render();window.scrollTo(0,0);
    clearInterval(statsTimer);if(filter==="stats"){loadStats();statsTimer=setInterval(loadStats,60000)}}
});
$("q").oninput=render;
$("older").onclick=loadOlder;
const syncSound=()=>$("soundBtn").textContent=sound?"🔔 Sound on":"🔕 Sound off";
$("soundBtn").onclick=()=>{sound=!sound;store.set("studioSound",sound);syncSound();if(sound)ping()};
$("logout").onclick=()=>lock("");
setInterval(()=>{if(byKey.size&&filter==="open")render()},30000);
syncSound();
if(key)start();
</script>
</body>
</html>
